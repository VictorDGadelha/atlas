<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Painel Pessoal{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <nav class="navbar navbar-dark bg-dark mb-4">
        <div class="container">
            <a class="navbar-brand" href="{% url 'home' %}">Painel Pessoal</a>
            <a class="nav-link text-white me-auto ms-3" href="{% url 'peso' %}">Peso</a>
            {% if user.is_authenticated %}
            <form method="post" action="{% url 'logout' %}" class="d-flex align-items-center gap-2 m-0">
                {% csrf_token %}
                <span class="text-white-50">{{ user.username }}</span>
                <button class="btn btn-outline-light btn-sm">Sair</button>
            </form>
            {% endif %}
        </div>
    </nav>

    <main class="container">
        {% if messages %}
    {% for message in messages %}
        <div class="alert alert-{{ message.tags }} alert-dismissible fade show">
            {{ message }}
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>
    {% endfor %}
{% endif %}
        {% block content %}{% endblock %}
    </main>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
